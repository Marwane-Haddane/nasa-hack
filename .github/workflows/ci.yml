name: NASA-HACK Monorepo CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev-integration
      - dev-frontend-3d
      - dev-backend-gnc
  pull_request:
    branches:
      - main
      - dev-integration

jobs:
  backend-ci:
    name: Backend 6-DOF Physics, GNC & WebSocket Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Unit & Integration Tests
        run: |
          pytest backend/tests -v --durations=10

  frontend-ci:
    name: Frontend Three.js, HUD & State Machine Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Run Frontend Test Suite
        working-directory: frontend
        run: npm test

      - name: Build Frontend Production Artifacts
        working-directory: frontend
        run: npm run build
